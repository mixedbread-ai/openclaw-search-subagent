name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      # dist/ is committed because ClawHub packs from the git tree and needs
      # compiled runtime output — fail if it drifts from src/.
      - run: git diff --exit-code dist
