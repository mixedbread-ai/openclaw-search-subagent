<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How search_subagent works</title>
  <desc>A main agent calls the search_subagent tool, which spawns a subagent session running the search agent on mixedbread/toast-1. The search agent greps the workspace read-only and findings flow back to the main agent as path:line references.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#9198a1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#e3b341" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ═══ Card: Main agent ═══ -->
  <rect x="24" y="64" width="156" height="84" rx="10" fill="#161b22" stroke="#3d444d" stroke-width="1.25"/>
  <text x="102" y="100" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">Main agent</text>
  <text x="102" y="122" text-anchor="middle" font-size="11.5" fill="#9198a1">Claude · any model</text>

  <!-- arrow 1: main → tool -->
  <line x1="180" y1="106" x2="298" y2="106" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="243" y="86" text-anchor="middle" font-size="11.5" fill="#9198a1">delegates</text>
  <text x="243" y="134" text-anchor="middle" font-size="11" fill="#9198a1" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">{ task }</text>
  <circle cx="243" cy="106" r="11" fill="#e3b341"/>
  <text x="243" y="110.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1f26">1</text>

  <!-- ═══ Card: Plugin tool ═══ -->
  <rect x="306" y="64" width="204" height="84" rx="10" fill="#161b22" stroke="#3d444d" stroke-width="1.25"/>
  <text x="408" y="98" text-anchor="middle" font-size="13" font-weight="600" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">search_subagent</text>
  <text x="408" y="120" text-anchor="middle" font-size="11.5" fill="#9198a1">OpenClaw plugin tool</text>

  <!-- arrow 2: tool → search agent -->
  <line x1="510" y1="106" x2="628" y2="106" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="573" y="86" text-anchor="middle" font-size="11.5" fill="#9198a1">spawns</text>
  <text x="573" y="134" text-anchor="middle" font-size="11" fill="#9198a1" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">subagent session</text>
  <circle cx="573" cy="106" r="11" fill="#e3b341"/>
  <text x="573" y="110.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1f26">2</text>

  <!-- ═══ Card: Search agent (Toast-1) ═══ -->
  <rect x="636" y="64" width="214" height="84" rx="10" fill="#271e0e" stroke="#6b5121" stroke-width="1.25"/>
  <text x="743" y="92" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">🍞 Search agent</text>
  <text x="743" y="112" text-anchor="middle" font-size="11" fill="#e3b341" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">mixedbread/toast-1</text>
  <rect x="691" y="121" width="104" height="18" rx="9" fill="#1a1408" stroke="#6b5121" stroke-width="1"/>
  <text x="743" y="134" text-anchor="middle" font-size="10" fill="#e3b341">read + exec only</text>

  <!-- arrow 3: search agent ⇄ workspace -->
  <line x1="858" y1="106" x2="948" y2="106" stroke="#9198a1" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="903" y="86" text-anchor="middle" font-size="11.5" fill="#9198a1">searches</text>
  <text x="903" y="134" text-anchor="middle" font-size="11" fill="#9198a1" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">rg · grep</text>
  <circle cx="903" cy="106" r="11" fill="#e3b341"/>
  <text x="903" y="110.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1f26">3</text>

  <!-- ═══ Card: Workspace ═══ -->
  <rect x="956" y="64" width="100" height="84" rx="10" fill="#161b22" stroke="#3d444d" stroke-width="1.25"/>
  <text x="1006" y="100" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">Workspace</text>
  <text x="1006" y="122" text-anchor="middle" font-size="11.5" fill="#9198a1">local files</text>

  <!-- transport panel under the plugin tool -->
  <line x1="408" y1="148" x2="408" y2="188" stroke="#3d444d" stroke-width="1.25" stroke-dasharray="3 3"/>
  <rect x="296" y="188" width="224" height="112" rx="10" fill="#151a21" stroke="#3d444d" stroke-width="1.25" stroke-dasharray="4 3"/>
  <text x="408" y="210" text-anchor="middle" font-size="10" letter-spacing="0.08em" fill="#9198a1">TRANSPORT · AUTO-SELECTED</text>
  <rect x="308" y="222" width="200" height="32" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1"/>
  <text x="408" y="242" text-anchor="middle" font-size="11.5" fill="#e6edf3">Gateway runtime · in-process</text>
  <rect x="308" y="262" width="200" height="32" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1"/>
  <text x="408" y="282" text-anchor="middle" font-size="11.5" fill="#e6edf3">CLI fallback · bridged runs</text>

  <!-- return path: search agent → main agent -->
  <path d="M 743 148 L 743 332 Q 743 344 731 344 L 114 344 Q 102 344 102 332 L 102 156" fill="none" stroke="#e3b341" stroke-width="1.6" marker-end="url(#arrowAccent)"/>
  <text x="422" y="328" text-anchor="middle" font-size="11.5" fill="#9198a1">returns findings</text>
  <text x="422" y="368" text-anchor="middle" font-size="11" fill="#e3b341" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">path:line · snippet · summary</text>
  <circle cx="422" cy="344" r="11" fill="#e3b341"/>
  <text x="422" y="348.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1f26">4</text>
</svg>
